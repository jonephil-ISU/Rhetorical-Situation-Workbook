<header><div class="wrap"><h1>Know Your Person</h1><p>TGE 1150 · Module 4 · Week 1 · Interactive Reading (Rhetorical Situation)</p></div></header>
<div class="wrap" id="app">
  <div class="progress" id="progress"></div>

<script>
var SECTIONS = [
{id:'start',title:'Start Here',kind:'start'},

/* ============ 1 BIG IDEA ============ */
{id:'big',chip:'Section A: The Big Idea',title:'A pitch is aimed at a person',
body:`<p>Here is the situation. You are on the job or in your program, in your field: a shop, a hangar, a pharmacy, a hospital unit, a salon, a lab, an IT help desk. You see a problem. A piece of equipment, a tool, or a piece of software would fix it. It costs real money. Somebody has to say yes.</p>
<p>That somebody is a person. Not a committee. Not a grading rubric. A person with a job, a budget, habits, and a point of view.</p>
<h3>Two pitches to the same boss</h3>
<p>Say two people pitch the same $4,000 machine to the same shop owner. We will call the owner Ray.</p>
<p><b>Pitch A</b> opens with a spec sheet. Horsepower, cycle times, a comparison chart of three brands. Every number is right.</p>
<p><b>Pitch B</b> opens with something else. The person knows Ray lost a week of work two years ago when a rushed purchase broke down and the dealer would not return calls. So Pitch B opens with: "Here is what happens if this machine goes down, and here is the warranty and the local service tech who will come out." Then the numbers.</p>
<p>Ray says "let me think about it" to Pitch A. He says "when can we get it?" to Pitch B. Both had good data. Only one was built around what Ray worries about.</p>
<p>That is the whole idea of this week. Data matters, but data does not make the decision. A person does. If you know what that person cares about, what worries them, and how they like to hear things, you can build a pitch they will listen to.</p>
<h3>What the fancy name means</h3>
<p>The class calls this the <b>Rhetorical Situation</b>. In plain words it is six questions you answer before you write anything:</p>
<ol>
<li><b>Your Role.</b> Who are you, and why should anyone listen to you on this?</li>
<li><b>Your Supervisor.</b> Who exactly are you convincing, and how do they think?</li>
<li><b>The Problem and the Ask.</b> What is going wrong, what does it cost, and what do you want approved?</li>
<li><b>The Situation on the Ground.</b> What is going on around this request: money, timing, history?</li>
<li><b>The Equipment or Tool.</b> What are you proposing, and why does each feature matter?</li>
<li><b>The Rules of the Proposal.</b> How is the proposal written, and how long is it?</li>
</ol>
<div class="example"><span class="tag">Meet Dani</span>
<p>To make this real, you will follow one example person through every step. Dani is an apprentice at a four-bay auto shop. The shop has one alignment rack. Dani wants the owner, Ray, to approve a second alignment machine, around $4,000. Dani is made up, and so are the numbers. Your field will be different. Dani works in an auto shop, but the same steps apply in a weld shop, a diesel bay, a hangar, a machine shop, a pharmacy, a hospital unit, a salon, an IT help desk, or a drafting department. You will build your own with your own real details.</p></div>
<p>Over the next three weeks you build your proposal one piece at a time. This week is the foundation. Everything after it sits on top of what you work out here. You will not see the Rhetorical Situation Profile worksheet until later in the week. This interactive reading is how you get ready for it, so take it seriously.</p>`,
goes:'This week sets up the rest of the proposal. Week 2 is research. Week 3 puts it all together.',
qs:[
 {q:'In the story, both pitches had accurate data. Why did Pitch B work better with Ray?',o:['It opened with a bigger discount than Pitch A','It was written in a more formal and serious tone','It compared more brands side by side in one chart','It was built around what Ray worries about most'],c:3,hint:'Look at what Pitch B opened with.',why:'Pitch B opened with Ray\'s worry (a machine breaking down), then gave the numbers.'},
 {q:'Dani has the best data in the shop, but the owner keeps saying "let me think about it." Based on this reading, what is the most likely problem?',o:['The data is too detailed for the owner to follow, so he stalls','The pitch is not built around what the owner cares about','The machine costs more than the owner expected to spend on it','Dani has not been at the shop long enough to be taken seriously'],c:1,hint:'Think about the difference between Pitch A and Pitch B.',why:'Good data alone does not decide a yes. The pitch has to fit the person.'},
 {q:'Which description best fits the Rhetorical Situation in plain words?',o:['Six questions about you, your person, and your request','A formal writing style used for research papers and reports','A checklist for formatting a proposal the right way every time','A method for finding and ranking good sources for your paper'],c:0,hint:'Read the section called "What the fancy name means."',why:'It is six questions you answer before you write anything.'},
 {q:'How do the three weeks fit together?',o:['Week 1 is research, Week 2 is the foundation, Week 3 is the final write-up','Week 1 is the foundation, Week 2 is the research, Week 3 is the final write-up','Week 1 is the final write-up, Week 2 is the research, and Week 3 is the foundation','Each week stands alone, and none of the weeks depend on the one before it'],c:1,hint:'See the last paragraph.',why:'Everything builds on Week 1.'}
],
write:{prompt:'Who is the one person you will be trying to convince? Write what you already know about them, one thing about them you still need to figure out, and where you could learn it.',min:30,use:'Step 2, Your Supervisor'}},

/* ============ 2 STEP 1 ============ */
{id:'s1',chip:'Section B: Step 1 of 6',title:'Your Role: why should they listen to you?',
body:`<p>Step 1 asks one question: who are you in this workplace, and why are you the one bringing this up?</p>
<p>Your supervisor hears pitches all the time. If your role sounds vague, they have no reason to take you seriously. What gives you <b>standing</b> is what you actually do and what you see because of it.</p>
<p>Standing is not your title. "Employee" tells them nothing. "Apprentice" tells them a little. What you do, how often, and how many tells them a lot.</p>
<h3>What standing is built from</h3>
<ul>
<li><b>What you do.</b> A real task, with numbers. How many, how often, how long.</li>
<li><b>What you see.</b> Because of your job, you notice things other people do not. The person on the floor sees the problem first. That is your reason for speaking up.</li>
<li><b>Your background.</b> A real piece of who you are that shapes how you show up at work. Where you grew up, what you did before, who taught you the trade.</li>
</ul>
<p>The worksheet also asks for your name and who you are, your job title, and how long you have held it. Those ground you. The role field is where the detail goes.</p>
<div class="example"><span class="tag">Watch it work: Dani, Step 1</span>
<div class="compare"><div class="thin"><b>Dani's first draft</b>"I'm a tech at the shop. I work hard and I like cars."</div><div class="det"><b>Dani's revision</b>"I'm Dani Ruiz, a second-year apprentice at a four-bay shop. I do about eight alignments a week, and I keep the rack schedule, so I'm the one who sees cars stack up when the rack is busy. I grew up helping my dad on his farm equipment, so I'm careful about anything that has to be done right."</div></div>
<div class="why">Why the revision works: it has a task (alignments), a number (eight a week), something Dani sees that others might not (cars stacking up), and a piece of background that explains how Dani approaches work.</div></div>
<h3>Doing this well</h3>
<ul>
<li>Name something you actually do, not just a title.</li>
<li>Use numbers wherever you can: how many, how often, how long.</li>
<li>Say what you see that other people do not, because of your role. That is your standing to bring this forward.</li>
<li>Include a real piece of your background that shapes how you show up at work.</li>
<li>Be honest. Your supervisor knows what you actually do. Stretching it costs you credibility the moment they notice.</li>
</ul>
<p>If you do not have a job right now, use your classes, a past job, a team, a club, or volunteer work. What do you actually do there, how often, and what have you noticed that others miss?</p>`,
goes:'Step 1 does not get its own section in the paper. It shapes how credible you sound everywhere in the paper.',
qs:[
 {q:'Which detail gives Dani the most standing to bring forward an alignment machine?',o:['Dani is the first one in and the last one out every day of the week','Dani has taken a class on suspension and steering at the college','Dani does about eight alignments a week and keeps the rack schedule','Dani has worked at the shop for three years and knows most customers'],c:2,hint:'Which one shows what Dani actually does, with a number?',why:'A real task with a number, tied to the problem, is standing.'},
 {q:'A student writes: "I am a welder." Which revision best follows the "Doing this well" rules?',o:['I am a first-year welder doing about 12 hours of MIG a week, and our booths run short on clamps','I am a welding student who takes real pride in laying clean, strong beads every single day of the week','I am a welding student who has been around welding since I was a kid, and I love the trade and the work','I weld nearly every day, I work hard, and I plan to make welding my career once I finish the program'],c:0,hint:'Look for a task, a number, and something the person notices.',why:'It has a number (12 hours), a real task, and an observation.'},
 {q:'Dani writes: "I have been here a while and I work hard." What is the best fix?',o:['Add how many years Dani has been there and what the job title is','Add a line about how much Dani loves the job and the people','Ask a coworker to write a better version of it for Dani','Replace it with what Dani does, how often, and what Dani sees'],c:3,hint:'Standing comes from what you do and what you see.',why:'Vague claims need to become specifics.'},
 {q:'Why should you not stretch the truth about your role?',o:['Supervisors rarely read this part, so it makes little difference to them','Making your role sound smaller makes the pitch look more modest and honest','Your supervisor knows what you do, so getting caught costs credibility','Your instructor checks job titles against company records before grading'],c:2,hint:'See the last "Doing this well" bullet.',why:'Your supervisor knows what you really do.'}
],
write:{prompt:'Write your role notes: what you actually do with a number on it, one thing you see that others miss, and one piece of your background. Then note which of these three you are weakest on and what you could dig up before you start the worksheet.',min:40,use:'Step 1, Your Role'}},

/* ============ 3 STEP 2A ============ */
{id:'s2a',chip:'Section C: Step 2 of 6, Part A',title:'Your Supervisor: pick a real person',
body:`<p>Step 2 is the most important step. You are building a profile of the person you must convince.</p>
<p>Here is the rule: <b>your supervisor cannot be invented.</b> Pick a real person you actually know. A parent, a current or former manager, a coach, a teacher. Then imagine them as your future boss in the field you are going into.</p>
<p>Why a real person? Because you cannot guess what a made-up boss would care about. You can answer honestly about someone you know. And the whole point of this course is learning to read a real person.</p>
<h3>How to choose</h3>
<ul>
<li><b>Pick someone you know well.</b> You should be able to answer "what would they say if I walked in with this?" without guessing.</li>
<li><b>Pick someone who would actually have to be convinced.</b> If your pick says yes to everything, you learn nothing about how to make a real case.</li>
<li><b>Do not worry about their actual job.</b> Your grandmother does not need to own a shop. You are imagining her as your future boss. What matters is that you know how she thinks about money, risk, and people.</li>
</ul>
<h3>Write a memory, not a description</h3>
<p>A description says "he is a careful boss." A memory says where you were, what he did, and what he said. A memory proves you know the person.</p>
<div class="example"><span class="tag">Watch it work: Dani, Step 2 Part A</span>
<div class="compare"><div class="thin"><b>Thin</b>"Ray is the owner. He is careful and cares about safety."</div><div class="det"><b>Detailed</b>"Ray Hale has owned the shop for 22 years and I have worked for him for three. Last winter he pulled a customer's truck off the lift halfway through a brake job because he noticed a slow leak nobody else saw. He said, 'We don't send anything out on a maybe.'"</div></div>
<div class="why">Why the detailed version works: you can picture the moment, and you now know something real about how Ray makes decisions.</div></div>
<h3>Doing this well</h3>
<ul>
<li>Write an actual memory: where you were, what they did, and what they said.</li>
<li>Include something they really said, in their words or close to it.</li>
<li>Say what they would ask first if you pitched them something. That question tells you what they care about most. For Ray, it might be: "What happens to my schedule while this gets installed?"</li>
</ul>
<p>If you cannot remember a real moment with this person, you have not picked someone you know well enough yet. Pick someone else.</p>`,
goes:'Like Step 1, this does not get its own section. It shapes how the whole paper is written, because you are writing it to convince this person.',
qs:[
 {q:'Dani only knows one thing about a possible pick: the person\'s job title. What should Dani do?',o:['Pick someone Dani knows well enough to remember real moments','Keep the pick and ask coworkers what the person is usually like','Keep the pick and describe the job title in a lot more detail','Pick the highest-ranking person Dani can think of in the field'],c:0,hint:'Read "How to choose."',why:'You need a person you know well, not just a title.'},
 {q:'Which is the strongest memory?',o:['My coach is tough but fair and expects a lot from everyone on the team every day','Coach cut practice short before state and said, \'Rest beats one more rep.\'','My coach has been coaching for over twenty years and has won several state titles','My coach always pushes us to be our best and never lets any of us quit'],c:1,hint:'Look for a moment with something the person actually said.',why:'It has a moment and a quote.'},
 {q:'Why is it useful to ask "what would they ask first if I pitched them something?"',o:['It tells you which section to write first','It gives you a way to dodge their hardest questions','It shows you what they care about most','It helps you guess the price they will accept'],c:2,hint:'See the last "Doing this well" bullet.',why:'The first question people ask shows what they care about most.'},
 {q:'A classmate picks a friend who would say yes to anything. What is the problem?',o:['Friends are too close to you to give an honest reaction to a pitch like this one','Friends rarely have the kind of work experience that a real supervisor would have','A supervisor pick has to be older than you to be taken seriously by the class','A yes-person does not teach you how to convince a real decision maker'],c:3,hint:'See "Pick someone who would actually have to be convinced."',why:'The point is learning to convince a real, skeptical person.'}
],
write:{prompt:'Name the real person you will use as your supervisor. Note how you know them, one moment you remember with them including something they said, and anything about them you would need to confirm.',min:50,use:'Step 2, Your Supervisor (who they are)'}},

/* ============ 4 STEP 2B ============ */
{id:'s2b',chip:'Section D: Step 2 of 6, Part B',title:'Your Supervisor: how they see work and where they lean',
body:`<p>Next, Step 2 asks you to describe how your person thinks about work. You do this three ways, and each one ties back to an earlier module.</p>
<h3>Their paradigm (Module 1)</h3>
<p>A <b>paradigm</b> is the set of beliefs and assumptions a person uses to decide what is normal, what matters, and what the right way to do work looks like. Think of it as the lens they see everything through. When you read about Challenger and Columbia, you saw what happens when a workplace's lens gets locked in. In the worksheet you pick one from this list:</p>
<div class="def"><b>Culture of Production:</b> getting output out the door comes first. Speed, volume, and deadlines drive decisions. <i>You hear: "We have to get this out today."</i></div>
<div class="def"><b>Culture of Safety:</b> preventing harm comes first. People are expected to stop work and speak up when something looks risky. <i>You hear: "If it feels wrong, stop."</i></div>
<div class="def"><b>Normalization of Deviance:</b> a shortcut once questioned slowly becomes "how we do it" because nothing bad has happened yet. <i>You hear: "We have always done it this way and nothing happened."</i></div>
<div class="def"><b>Structural Secrecy:</b> information gets lost or filtered because of how the organization is set up. <i>You hear: "Nobody told me about that."</i></div>
<div class="def"><b>Culture of Compliance:</b> rules, policies, and regulations drive decisions. <i>You hear: "What does the policy say?"</i></div>
<div class="def"><b>Culture of Cost-Containment:</b> money is the main lens. Every request has to prove it saves or earns more than it costs. <i>You hear: "What does it cost, and what does it save?"</i></div>
<div class="def"><b>Just Culture / Learning Culture:</b> mistakes are a chance to learn and fix the system, not just a reason to punish. <i>You hear: "What can we change so this does not happen again?"</i></div>
<div class="def"><b>Command Culture:</b> authority and chain of command drive decisions. <i>You hear: "Who signed off on this?"</i></div>
<h3>Their bias (Module 2)</h3>
<p>A <b>bias</b> is a lean. Everybody has one. A paradigm is the lens they see work through. A bias is a mental shortcut that tilts their judgment, often without them noticing. In the worksheet you pick one from this list:</p>
<div class="def"><b>Confirmation Bias:</b> favoring information that matches what you already believe.</div>
<div class="def"><b>Status Quo Bias:</b> keeping things as they are because change feels risky or like extra work.</div>
<div class="def"><b>Authority Bias:</b> weighing an idea by who said it instead of the reasoning behind it.</div>
<div class="def"><b>Sunk Cost Bias:</b> sticking with something because of time or money already put in, even when it is not working.</div>
<div class="def"><b>Risk Aversion Bias:</b> choosing the familiar option over a better one because the unknown feels too uncertain.</div>
<div class="def"><b>Halo Effect:</b> assuming something is good overall because one part impressed you, like a brand name.</div>
<div class="def"><b>Anchoring Bias:</b> getting stuck on the first number you hear and judging everything after it.</div>
<div class="def"><b>Availability Bias:</b> judging how common a problem is by how recently or vividly you experienced it.</div>
<div class="def"><b>Optimism Bias:</b> assuming things will turn out fine and underestimating the odds something goes wrong.</div>
<p>When you pick one in the worksheet, a definition appears with an "Ask yourself" question. Read it. Then answer by pointing to a real moment. A label by itself proves nothing. The moment proves it.</p>
<h3>Their identity (Module 3)</h3>
<p>Last, name their generation or cultural background and connect it to the memory you wrote. Then say what matters most to them. The finished profile should read like one person, not a list of labels.</p>
<div class="example"><span class="tag">Watch it work: Dani, Step 2 Part B</span>
<p><b>Paradigm: Culture of Safety.</b> "Ray pulled the truck off the lift on a maybe. He has said more than once, 'Nobody gets hurt in my shop.' When we got a cheaper scanner last year he made me test it on three cars before he would trust it."</p>
<p><b>Bias: Risk Aversion Bias.</b> "He kept our old shop computer for six years after it started freezing because he did not want to learn a new system. Ray picks the safe, familiar option, even when a better one is sitting right there."</p>
<p><b>Identity:</b> "Ray is in his late fifties and started as a mechanic in the nineties, when you learned by watching someone older. He trusts people who have been proven, and he trusts brands he has seen work."</p>
<p><b>What matters most:</b> "That nobody gets hurt and that the bays stay booked."</p>
<div class="why">What this tells Dani about the pitch: lead with safety, address Ray's fear of the unfamiliar with a warranty, a trial, and local service, and bring names of other shops that already use the machine. Each answer points to a real moment.</div></div>`,
goes:'This also has no section of its own. It tells you how to shape your pitch for this person.',
qs:[
 {q:'What is the difference between a paradigm and a bias?',o:['A paradigm is a mental shortcut that tilts their judgment, and a bias is the lens they see work through','A paradigm is a person\'s job title and years on the job, and a bias is their attitude toward change','A paradigm is the lens they see work through, and a bias is a shortcut that tilts their judgment','They mean the same thing, and the reading just uses both words'],c:2,hint:'Re-read the first sentence under "Their paradigm" and the first lines under "Their bias."',why:'A paradigm is the lens of beliefs. A bias is the shortcut that tilts judgment.'},
 {q:'Your person says "show me the policy first" and wants to know what the regulations require before anything else. Which paradigm fits best?',o:['Culture of Compliance','Culture of Production','Just Culture / Learning Culture','Culture of Safety'],c:0,hint:'Which one leads with rules and policies?',why:'Compliance starts with "what does the policy say?"'},
 {q:'Your person keeps an old air compressor that keeps failing because they spent $6,000 on it and will not give up on it. Which bias is that?',o:['Confirmation Bias','Anchoring Bias','Authority Bias','Sunk Cost Bias'],c:3,hint:'Which bias is about time or money already put in?',why:'Sticking with something because of what you already spent is Sunk Cost Bias.'},
 {q:'Dani\'s person, Ray, leans toward Risk Aversion Bias. Which pitch choice fits best?',o:['Lead with the lowest price and push hard for a quick yes today','Show the newest model with the most advanced features available','Tell Ray his old equipment is a safety hazard in the shop','Offer a trial period, a warranty, and shops already using it'],c:3,hint:'What does a person afraid of the unfamiliar need to see?',why:'Warranty, a trial, and proof from other shops answer the fear of the unknown.'},
 {q:'Which "why this matches" is the strongest?',o:['Safety fits because he pulled a truck off the lift on a maybe','Safety fits because he is a careful person and everyone who knows him says so, too','Safety fits because it is the most important value in any shop, no matter the field','Safety fits because he follows the shop\'s written rules every day and expects the same'],c:0,hint:'Which answer points to a real moment?',why:'Pointing to a real moment is what proves the label.'}
],
write:{prompt:'Write which paradigm and which bias you think fit that person. For each one, note the moment or quote that backs it up, and one thing that might make you wrong.',min:60,use:'Step 2, Your Supervisor (their paradigm and bias)'}},

/* ============ 5 STEP 3 ============ */
{id:'s3',chip:'Section E: Step 3 of 6',title:'The Problem and the Ask',
body:`<p>Now you get to the point. Step 3 asks for three things: a specific incident, a specific cost, and one clear sentence that says what you want.</p>
<p>Vague versions are easy to write and easy to dismiss. "Our equipment is old" gets a shrug. A specific incident with a number gets attention.</p>
<h3>1. The problem, with the incident that proves it</h3>
<p>Describe the last time it actually happened. When it happened, what happened, and who or what it affected. Then put numbers on it: hours waited, jobs turned away, dollars lost, vehicles backed up.</p>
<p>No numbers handy? Estimate honestly and say it is an estimate. "About six hours" is fine. You can count from memory, check a schedule, a log, or a receipt, or ask a coworker. Do not invent a number and present it as fact.</p>
<h3>2. The cost of doing nothing</h3>
<p>If nothing changes, what gets worse over the next few months, and roughly when? "It keeps being a problem" does not count. Take the incident and ask how often it could happen and what that adds up to.</p>
<h3>3. The ask</h3>
<p>Say exactly what you want approved. Name the exact item, and say what decision you need. After one read, your supervisor should know what to approve.</p>
<div class="example"><span class="tag">Watch it work: Dani, Step 3</span>
<div class="thin" style="border-radius:10px;padding:12px 14px;margin:10px 0 14px;font-size:16px"><b style="display:block">Dani's first draft</b>Problem: "The rack is a bottleneck." Cost: "It slows us down." Ask: "I think we need better alignment equipment."</div>
<p><b>Dani's revision:</b></p>
<p><b>Problem:</b> "Last Tuesday our only alignment rack was down for six hours for a hydraulic fix. We turned away four alignment jobs. At about $160 each, that is roughly $640 gone in one day."</p>
<p><b>Cost of doing nothing:</b> "A rack goes down about once a month. At $640 a time, that is about $7,700 a year in turned-away work, and some of those customers do not come back."</p>
<p><b>Ask:</b> "I am asking you to approve buying a second alignment machine, around $4,000, so the shop is never down to one rack."</p>
<div class="why">Why it works: one specific incident, numbers that add up, a yearly cost that shows what waiting costs, and an ask that names the item, the price, and the decision.</div></div>
<h3>Doing this well</h3>
<ul>
<li>Describe one specific incident: when it happened, what happened, and who or what it affected.</li>
<li>If you work in your industry, use a real incident. If you do not have experience yet, imagine a realistic one in your industry and say that it is imagined.</li>
<li>Put numbers on it: hours waited, jobs turned away, dollars lost, vehicles backed up.</li>
<li>In the cost of doing nothing, say what gets worse and roughly when.</li>
<li>Make your ask name the exact item. After one read, your supervisor should know what to approve.</li>
</ul>`,
goes:'This becomes the start of the Introduction in your final paper: the problem you are solving and why it matters.',
qs:[
 {q:'Which problem statement is missing the most?',o:['On March 3 our only press brake was down five hours and we missed a shipment worth about $2,000','Last week the lift was down for a day and two customers left','Our equipment is old and has been giving us trouble for a while now','Last month the compressor failed twice, costing about three hours each time'],c:2,hint:'Look for the one with no date, no number, and no incident.',why:'"Old and breaks sometimes" gives no moment and no numbers.'},
 {q:'Dani\'s rack goes down about once a month and each time costs about $640. About what is the yearly cost of doing nothing?',o:['About $3,800','About $7,700','About $15,400','About $640'],c:1,hint:'$640 times 12 months.',why:'12 times $640 is about $7,680, or roughly $7,700.'},
 {q:'Which is the best ask?',o:['I would like to talk with you about adding a second alignment machine when you have some time','I really think a second alignment machine would help the whole shop a lot in the long run','I am asking you to approve a second alignment machine for about $4,000','Please consider whether a second alignment machine might eventually fit into the shop budget'],c:2,hint:'Which one names the item, the price, and the decision?',why:'It names the exact item and the decision needed.'},
 {q:'You do not have an exact number for your incident. What should you do?',o:['Skip the number and describe the problem in words alone, since numbers can be wrong','Use a number from an article about similar shops','Round to a number that sounds convincing to the reader','Estimate honestly, say it is an estimate, and check a log or a coworker'],c:3,hint:'See the paragraph that starts "No numbers handy?"',why:'Honest estimates are fine. Invented facts are not.'}
],
write:{prompt:'Jot down a problem and the incident behind it. If you work in your industry, use a real one. If you do not have experience yet, imagine a realistic scenario in your industry and say that it is imagined. Include the date, who or what it affected, and a number (an honest estimate is fine).',min:50,use:'Step 3, The Problem and the Ask'}},

/* ============ 6 STEP 4 ============ */
{id:'s4',chip:'Section F: Step 4 of 6',title:'The Situation on the Ground',
body:`<p>Step 4 is about the circumstances around your request. A supervisor never says yes in a vacuum. They think about money, timing, and history. It has three quick questions.</p>
<ul>
<li><b>Budget cycle.</b> Is there a known budget window or funding cycle that affects this request? Some places buy equipment once a year. Some buy whenever there is cash. Knowing which helps you time the ask.</li>
<li><b>Timing pressure.</b> Is there a deadline or scheduling reason this needs to happen soon? A busy season, a contract, a safety inspection, a warranty that is running out.</li>
<li><b>Precedent.</b> Has a similar purchase happened before, at your workplace or a comparable one? If yes, how did it go? If no, why not?</li>
</ul>
<p>Either a yes or a no can be right. What counts is the explanation. A yes or no by itself is only the start.</p>
<div class="example"><span class="tag">Watch it work: Dani, Step 4</span>
<p><b>Budget cycle: No.</b> "Ray does not run a yearly equipment budget. He buys equipment one piece at a time out of shop profit, usually after a good month. That means my pitch has to show how quickly the machine pays for itself."</p>
<p><b>Timing pressure: Yes.</b> "Winter tire season starts in October and our alignment work doubles. Last year we were backed up almost every Saturday from October to January."</p>
<p><b>Precedent: Yes.</b> "Three years ago Ray bought a new tire machine for about $5,000. He told me it paid for itself in about a year. He still brings that up when we talk about equipment."</p>
<div class="why">Why it works: each answer has a fact only this workplace would have. Each one also tells Dani something about how to build the pitch.</div></div>
<h3>Doing this well</h3>
<ul>
<li>Back up every answer with facts: dates, dollar amounts, names of past purchases, deadlines.</li>
<li>A "no" is a perfectly good answer. Explain it with real facts about your own workplace, school, or team.</li>
<li>Test each answer: could it apply to any workplace? If so, rewrite it until it could only be about yours.</li>
</ul>`,
goes:'This feeds the Introduction and your final recommendation. It explains why your request matters now and whether the timing works.',
qs:[
 {q:'Dani writes: "Yes, there is a budget." What is missing?',o:['A stronger first sentence that grabs the reader\'s attention','The facts: when it happens and how it works','A comparison to a budget at another shop in town','Nothing, because a yes already answers the question fully'],c:1,hint:'A yes or no is only the start.',why:'The explanation with facts is what counts.'},
 {q:'Which is the strongest way to explain a "no" to the budget question?',o:['No, we do not really have a set budget for it right now, so I am not sure how it all works here','No. Budgets are complicated and change from year to year, so it is hard to say much about it here','No. Ray has no yearly equipment budget. He buys one piece at a time from shop profit.','No, and I would rather not guess about how the money works at the shop, so I am leaving it there'],c:2,hint:'Look for the one that explains how things actually work.',why:'A strong no explains the real situation with facts.'},
 {q:'Why does precedent matter to a supervisor?',o:['It proves the purchase is allowed by law and by shop policy','It shows how the supervisor has seen a similar purchase turn out','It means the supervisor will probably say yes to this one too','It lets you skip the budget question because the money is the same'],c:1,hint:'Think about what a past purchase tells a supervisor.',why:'Past purchases show how the supervisor has seen this go.'},
 {q:'Which answer passes the "could this apply to any workplace?" test?',o:['We get really busy once the weather turns cold, and we have a hard time keeping up with all the work','Our busy season is coming up soon, so the timing of this purchase matters quite a lot for the shop','Winter tire season starts in October and alignment work doubles. We were backed up most Saturdays.','Timing is important for any shop that wants to stay competitive and keep up with what customers expect from it'],c:2,hint:'Which one could only be about this workplace?',why:'Only this workplace has those details.'}
],
write:{prompt:'For budget, timing, and precedent, write what you already know and what you would need to check. Pick the one you are most sure about and say why.',min:40,use:'Step 4, The Situation on the Ground'}},

/* ============ 7 STEP 5 ============ */
{id:'s5',chip:'Section G: Step 5 of 6',title:'The Equipment or Tool',
body:`<p>Step 5 is where you name what you are proposing. Lay out what you have now next to what you want instead. Then pick features and explain why each one matters to the problem you described in Step 3.</p>
<h3>What you have now</h3>
<p>Describe it in measurable terms. How many, how often it is booked, how long a job takes, how old it is. "Our current rack is 15 years old, booked about six hours a day, and an alignment takes about 50 minutes" is something a supervisor can picture.</p>
<h3>What you are proposing</h3>
<p>Name the actual item, with brand and model if you know it. If you do not know yet, say what type of equipment it is. You will research it in Week 2, so it is okay to make your best starting guess now.</p>
<h3>Features, tied to your problem</h3>
<p>A <b>feature</b> is a real spec or capability. "Better" and "newer" are not features. Every feature you list needs a "why it matters" that ties back to the exact problem from Step 3, using the same details.</p>
<div class="example"><span class="tag">Watch it work: Dani, Step 5</span>
<p><b>Now:</b> "One 15-year-old alignment rack, booked about six hours a day. An alignment takes about 50 minutes."</p>
<p><b>Proposing:</b> "A second alignment machine in the $4,000 range. The exact model comes from Week 2 research."</p>
<p><b>Feature 1:</b> "Runs a full alignment in about 20 minutes. <i>Why it matters:</i> the rack is blocked less, so on a day like last Tuesday we are not turning away four jobs."</p>
<p><b>Feature 2:</b> "Comes with a multi-year warranty and local service. <i>Why it matters:</i> Ray worries about being stuck with a machine nobody will fix. This answers it before he asks."</p>
<div class="why">Why it works: each feature is a real capability, and each "why it matters" points to the Step 3 problem and to what Ray cares about from Step 2. The pitch fits together.</div></div>
<h3>Doing this well</h3>
<ul>
<li>Name the actual item, with brand and model if you know it, and describe what you have now in measurable terms.</li>
<li>Make each feature a real spec or capability. "Better" and "newer" do not count.</li>
<li>Tie each "why it matters" back to the exact problem from Step 3.</li>
<li>Pick features you can explain. Every feature you list, expect a question about it later.</li>
</ul>`,
goes:'This is the product you will research in Week 2. What you learn about it ends up in the Review of Literature and the Methodology.',
qs:[
 {q:'Which is a real feature with a good "why it matters"?',o:['It is newer than what we have, so it should last longer and need fewer repairs','It is a well-known brand, so customers will trust the shop more','A full alignment takes about 20 minutes, so the rack is free sooner','It is better quality overall, so the shop gets more value for the money'],c:2,hint:'Look for a real capability tied to the problem.',why:'A real spec tied to the problem is a strong feature.'},
 {q:'Which description of the current setup is best?',o:['An old rack that is slow and has needed a lot of repairs over the last few years','One rack that works fine most days but is getting outdated and slower every year','A rack that is not as good as the newer ones that other shops in town have','One 15-year-old rack, booked six hours a day, 50 minutes per alignment'],c:3,hint:'Look for measurable terms.',why:'How many, how booked, how long: that is measurable.'},
 {q:'A student writes: "It is newer, so it is more reliable." What is the problem?',o:['It is too short to count as a full feature in the worksheet, so it needs more words','"Newer" is not a feature, and "reliable" does not say what the equipment does','It should name a brand instead of just a type of machine','It leaves out the price, which the supervisor will want to see first'],c:1,hint:'See the section on features.',why:'It claims something without a real spec.'},

],

/* ============ 8 STEP 6 ============ */
{id:'s6',chip:'Section H: Step 6 of 6',title:'The Rules of the Proposal (Genre and Constraints)',
body:`<p>Every workplace has rules for how a proposal is written and how long it can be. Step 6 is where you learn yours. This step is already filled in for you in the worksheet, so your job is to understand it.</p>
<p>The fancy words are <b>genre</b> and <b>constraints</b>. Genre means the kind of document it is, a workplace proposal. Constraints means the limits, like length and due date.</p>
<h3>Tone</h3>
<p>Plain, direct, and professional. Write the way you would explain this to your supervisor in person: clear, specific, and no fancy words.</p>
<div class="compare"><div class="thin"><b>Too fancy</b>"It is imperative that the establishment procure additional alignment instrumentation."</div><div class="det"><b>Plain and direct</b>"We need a second alignment machine so we stop turning away jobs."</div></div>
<h3>Structure</h3>
<p>The proposal has five sections, in this order: Introduction, Review of Literature, Methodology, Conclusion, References.</p>
<h3>Length and due date</h3>
<p>Around 3 to 4 pages. Due before your final defense meeting.</p>
<h3>Where each piece ends up</h3>
<p>Over three weeks you build your proposal one piece at a time. At the end, the pieces get put together in the order above. You do not need to memorize it. Just know where what you are doing now ends up.</p>
<div class="def"><b>Introduction (Weeks 1 and 2):</b> the problem you are solving, why it matters, what you expect to find, and the kind of research you will do. It starts with your problem and ask from this week.</div>
<div class="def"><b>Review of Literature (Week 2):</b> the research you do about who is affected, the workplace principle behind it, and where it happens.</div>
<div class="def"><b>Methodology (Week 3):</b> how you gathered your evidence, what could have skewed it, and whether it applies beyond your own workplace.</div>
<div class="def"><b>Conclusion (Week 3):</b> did the evidence back up what you expected? Said in your own words, based on what you found.</div>
<div class="def"><b>References (as you go):</b> every source you used, with a working link.</div>
<div class="callout big">The Conclusion is written by YOU, not by AI.</div>
<p>Every other section gets assembled from the pieces you build. Your Conclusion is the one you write yourself, in your own words, based on what you found. AI does not write it, edit it, or touch it.</p>
<p>Why? The Conclusion is your judgment. It answers "did the evidence back up what I expected?" Only you know what you found and what you think about it. That is the part your supervisor is really asking for.</p>`,
goes:'This is the map for the next three weeks. Know where each piece you build ends up.',
qs:[
 {q:'Which sentence matches the tone rule?',o:['It is imperative that the establishment procure additional equipment','We need a second alignment machine so we stop turning away jobs','We should probably, like, get a second machine at some point','The purchase of an additional apparatus is hereby recommended'],c:1,hint:'Plain, direct, and professional, like explaining it in person.',why:'It is clear, specific, and has no fancy words.'},
 {q:'Which list shows the required structure in order?',o:['Introduction, Methodology, Review of Literature, Conclusion, References','Introduction, Review of Literature, Conclusion, Methodology, References','Review of Literature, Introduction, Methodology, Conclusion, References','Introduction, Review of Literature, Methodology, Conclusion, References'],c:3,hint:'See the Structure heading.',why:'Introduction, Review of Literature, Methodology, Conclusion, References.'},
 {q:'Where does your Step 3 problem and ask end up in the final paper?',o:['In the middle of the Review of Literature','Inside the Methodology, next to the evidence','At the start of the Introduction','At the end of the Conclusion, as a final point'],c:2,hint:'Step 3 and the Introduction were connected earlier in this reading.',why:'The problem and ask start the Introduction.'},
 {q:'Which section do you write completely yourself, and why?',o:['The Introduction, because it describes your own problem and your own request','The Methodology, because only you know how you gathered it and what you saw','The References, because only you know what you used and where it came from','The Conclusion, because it is your judgment of what the evidence showed'],c:3,hint:'Look at the big orange box and the paragraph after it.',why:'The Conclusion is your judgment, so it has to be yours.'},
 {q:'What are the length and due date?',o:['About 5 to 6 pages, due before the final defense meeting with your instructor','About 3 to 4 pages, due at the end of Week 3','Around 3 to 4 pages, due before your final defense meeting','About 1 to 2 pages, due before the final defense meeting'],c:2,hint:'See "Length and due date."',why:'Around 3 to 4 pages, due before the final defense meeting.'}
],
write:{prompt:'Write a plan for your own writing: how you will keep it plain, direct, and professional.',min:40,use:'Step 6, The Rules of the Proposal'}},

var STATE={name:'',cur:0,unlocked:0,q:{},w:{}};
var KEY='tge1150_m4w1_reading_v3';try{localStorage.removeItem('tge1150_m4w1_reading_v2');}catch(e){}
try{var sv=localStorage.getItem(KEY);if(sv){var o=JSON.parse(sv);if(o&&o.q)STATE=o;}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){}}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qKey(i,j){return SECTIONS[i].id+'_'+j;}
function wc(t){var m=(t||'').trim().match(/\S+/g);return m?m.length:0;}
function wDone(i){var s=SECTIONS[i];if(!s.write)return true;return wc(STATE.w[s.id])>=s.write.min;}
function secDone(i){var s=SECTIONS[i];if(s.kind==='start')return !!STATE.name.trim();if(s.kind==='finish')return false;
  for(var j=0;j<s.qs.length;j++){var r=STATE.q[qKey(i,j)];if(!r||!r.correct)return false;}
  return wDone(i);}

function renderProgress(){
  var p=document.getElementById('progress');p.innerHTML='';
  SECTIONS.forEach(function(s,i){var d=document.createElement('div');d.className='dot'+(i===STATE.cur?' cur':(i<STATE.unlocked&&secDone(i)?' done':''));p.appendChild(d);});
  document.getElementById('plabel').textContent='Section '+(STATE.cur+1)+' of '+SECTIONS.length+': '+SECTIONS[STATE.cur].title;
}

function render(){
  var s=SECTIONS[STATE.cur],i=STATE.cur,html='';
  renderProgress();
  if(s.kind==='start'){
    html+='<div class="panel"><span class="chip">Week 1</span><h2>Know your person</h2>';
    html+='<p>This is an interactive reading. It teaches you the six parts of the Rhetorical Situation, which is really a way to get to know the person you need to convince. You will not see the Rhetorical Situation Profile worksheet until later in the week, so this reading is where you learn what it asks and how to do it well.</p>';
    html+='<h3>How it works</h3><ul><li>Read each section. Each one follows one example person, Dani, so you can see the idea in action.</li><li>Answer the questions. You have to get every one right to move on. If you miss one, the reading tells you where to look, and you try again.</li><li>Most sections end with short notes for your worksheet. Write them about your own situation. Your instructor reads these. Each has a minimum word count.</li><li>At the end you print the reading to a PDF and submit it. The PDF shows your answers and your worksheet notes.</li></ul>';
    html+='<label class="l" for="nm">Your first and last name</label><input type="text" id="nm" value="'+esc(STATE.name)+'" placeholder="First Last" autocomplete="name">';
    html+='</div>';
    html+='<div class="nav"><span class="lockmsg" id="lm"></span><button class="btn" id="nx" disabled onclick="go(1)">Start reading</button></div>';
    document.getElementById('stage').innerHTML=html;
    var nm=document.getElementById('nm');
    function chk(){STATE.name=nm.value;persist();var ok=!!nm.value.trim();document.getElementById('nx').disabled=!ok;document.getElementById('lm').textContent=ok?'':'Enter your name to begin.';}
    nm.addEventListener('input',chk);chk();
    return;
  }
  if(s.kind==='finish'){
    html+='<div class="panel"><span class="chip">Finished</span><h2>Finish and submit</h2><p>You read all eight sections, answered every question correctly, and wrote your responses. Here is what you completed:</p>';
    for(var k=1;k<SECTIONS.length-1;k++){html+='<div class="sumrow"><span>'+esc(SECTIONS[k].title)+'</span><span>Complete</span></div>';}
    html+='<h3>What to do now</h3><ul><li>Click <b>Download PDF</b>. Your print window opens. Choose <b>Save as PDF</b> as the destination.</li><li>Submit that PDF for the Week 1 assignment. Keep a copy of it too. Have it open when you start the Rhetorical Situation Profile. The notes you wrote in each section are your guide for the matching step.</li><li>Keep your thinking. When you open the Rhetorical Situation Profile worksheet, you will write your real answers for each of the six steps. Your person, your problem, and your equipment from this reading are your starting point.</li></ul>';
    html+='<div class="row"><button class="btn" onclick="doPrint()">Download PDF</button></div></div>';
    html+='<div class="nav"><button class="btn alt" onclick="go(-1)">Back</button><span></span></div>';
    document.getElementById('stage').innerHTML=html;return;
  }
  html+='<div class="panel"><span class="chip">'+esc(s.chip)+'</span><h2>'+esc(s.title)+'</h2>'+s.body;
  if(s.goes)html+='<div class="goes"><b>Where this goes:</b> '+esc(s.goes)+'</div>';
  html+='<div class="check"><h3>Check what you read</h3><p style="font-size:15px;color:var(--muted)">Answer every question correctly to unlock the next part.</p>';
  s.qs.forEach(function(q,j){
    var st=STATE.q[qKey(i,j)]||{};
    html+='<div class="q" data-j="'+j+'"><div class="qt">'+(j+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach(function(o,k){var cls='opt'+(st.correct&&k===q.c?' right':'');html+='<button class="'+cls+'" data-k="'+k+'"'+(st.correct?' disabled':'')+'>'+esc(o)+'</button>';});
    html+='<div class="fb'+(st.correct?' ok':' hidden')+'" id="fb'+j+'">'+(st.correct?'Correct. '+esc(q.why):'')+'</div></div>';
  });
  html+='</div>';
  if(s.write){html+='<div class="write"><h3>Notes for your worksheet</h3><p style="font-size:15px;color:var(--muted)">Write notes you will use when you fill out the worksheet. Your own situation, not Dani.</p><p style="font-size:15px;font-weight:600;color:var(--navy)">Use these notes in the worksheet: '+esc(s.write.use)+'.</p><p>'+esc(s.write.prompt)+'</p><textarea id="wr" placeholder="Write your notes here."></textarea><div class="wc" id="wcnt"></div></div>';}
  html+='</div>';
  html+='<div class="nav"><button class="btn alt" onclick="go(-1)">Back</button><span class="lockmsg" id="lm"></span><button class="btn" id="nx" onclick="go(1)">'+(i===SECTIONS.length-2?'Finish':'Next section')+'</button></div>';
  document.getElementById('stage').innerHTML=html;
  document.querySelectorAll('.q').forEach(function(qe){
    var j=+qe.getAttribute('data-j');
    qe.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){answer(i,j,+b.getAttribute('data-k'),qe);});});
  });
  if(s.write){var ta=document.getElementById('wr');ta.value=STATE.w[s.id]||'';
    ta.addEventListener('input',function(){STATE.w[s.id]=ta.value;persist();updateNext();});}
  updateNext();
}

function answer(i,j,k,qe){
  var q=SECTIONS[i].qs[j],key=qKey(i,j),st=STATE.q[key]||(STATE.q[key]={attempts:0,correct:false});
  if(st.correct)return;
  st.attempts++;
  var fb=qe.querySelector('.fb'),btns=qe.querySelectorAll('.opt');
  if(k===q.c){
    st.correct=true;
    btns.forEach(function(b){b.disabled=true;if(+b.getAttribute('data-k')===k)b.classList.add('right');b.classList.remove('wrong');});
    fb.className='fb ok';fb.textContent='Correct. '+q.why;
  }else{
    btns.forEach(function(b){b.classList.remove('wrong');if(+b.getAttribute('data-k')===k)b.classList.add('wrong');});
    fb.className='fb no';fb.textContent='Not quite. '+q.hint+' Then try again.';
  }
  persist();updateNext();
}

function updateNext(){
  var i=STATE.cur,s=SECTIONS[i],nx=document.getElementById('nx'),lm=document.getElementById('lm');
  if(!nx||s.kind)return;
  var done=secDone(i),qsDone=true;
  for(var j=0;j<s.qs.length;j++){var r=STATE.q[qKey(i,j)];if(!r||!r.correct)qsDone=false;}
  nx.disabled=!done;
  var msg='';
  if(!qsDone)msg='Answer every question correctly to continue.';
  else if(!wDone(i))msg='Finish your notes to continue.';
  if(lm)lm.textContent=msg;
  if(s.write){var c=wc(STATE.w[s.id]),el=document.getElementById('wcnt');if(el){var ok=c>=s.write.min;el.className='wc'+(ok?' ok':'');el.textContent=c+' words'+(ok?'. Good.':'. Minimum is '+s.write.min+'.');}}
  if(done&&STATE.unlocked<i+1)STATE.unlocked=i+1;
  renderProgress();
}

function go(d){
  var n=STATE.cur+d;
  if(n<0||n>=SECTIONS.length)return;
  if(d>0&&!secDone(STATE.cur))return;
  STATE.cur=n;if(STATE.unlocked<n)STATE.unlocked=n;
  persist();render();window.scrollTo({top:0,behavior:'smooth'});
}

function buildPrint(){
  var d=new Date().toLocaleDateString();
  var h='<h1>Know Your Person: Interactive Reading</h1><div class="pv-meta">TGE 1150 · Module 4 · Week 1<br><b>Name:</b> '+esc(STATE.name)+' &nbsp; <b>Date:</b> '+esc(d)+'</div>';
  for(var i=1;i<SECTIONS.length-1;i++){
    var s=SECTIONS[i];h+='<div class="pv-sec"><h4>'+esc(s.chip)+': '+esc(s.title)+'</h4>';
    s.qs.forEach(function(q,j){var st=STATE.q[qKey(i,j)]||{attempts:0};h+='<div class="pv-q">'+(j+1)+'. '+esc(q.q)+'<br><i>Answer: '+esc(q.o[q.c])+' (correct on attempt '+st.attempts+')</i></div>';});
    if(s.write){h+='<div class="pv-q pv-w"><b>Worksheet notes (for the Profile worksheet, '+esc(s.write.use)+'):</b> '+esc(s.write.prompt)+'</div><div class="pv-r">'+esc(STATE.w[s.id]||'')+'</div>';}
    h+='</div>';
  }
  h+='<div class="pv-attest">I read each section, answered every question, and wrote my responses in my own words. Signed: '+esc(STATE.name)+'</div>';
  document.getElementById('printView').innerHTML=h;
}
function doPrint(){buildPrint();window.print();}
window.addEventListener('beforeprint',buildPrint);
render();
</script>
